syntax = "proto3";

package admin;

option go_package = "https://github.com/AndreyLebedev1998/admin-grpc/admin";

message TelegramToken {
    int64 id = 1;
    string token = 2;
}

message DataFromConnEmail {
    string password = 1;
    string sender_email = 2;
}

message Empty {}

service AdminService {
    rpc GetTelegramToken(Empty) returns (TelegramToken);
    rpc GetDataFromConnectionEmail(Empty) returns (DataFromConnEmail);
}
